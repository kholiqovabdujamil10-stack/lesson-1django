{% extends 'base.html' %}
{% block title %}Edit Game{% endblock %}
{% block content %}

<div class="row justify-content-center mt-4">
    <div class="col-md-7">

        <div class="card shadow p-4">
            <h2 class="text-center mb-4">Edit Game</h2>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Sport</label>
                    <select name="sport" class="form-select" required>
                        {% for sport in sports %}
                        <option value="{{ sport.id }}" {% if game.sport.id == sport.id %}selected{% endif %}>{{ sport.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Home Team</label>
                    <select name="home_team" class="form-select" required>
                        {% for team in teams %}
                        <option value="{{ team.id }}" {% if game.home_team.id == team.id %}selected{% endif %}>{{ team.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Away Team</label>
                    <select name="away_team" class="form-select" required>
                        {% for team in teams %}
                        <option value="{{ team.id }}" {% if game.away_team.id == team.id %}selected{% endif %}>{{ team.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Date and Time</label>
                    <input type="datetime-local" name="date" value="{{ game.date|date:'Y-m-d\TH:i' }}"
                        class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Stadium</label>
                    <input type="text" name="stadium" value="{{ game.stadium }}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Ticket Price</label>
                    <input type="number" name="ticket_price" value="{{ game.ticket_price }}" class="form-control"
                        min="0" step="0.01" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Available Tickets</label>
                    <input type="number" name="available_tickets" value="{{ game.available_tickets }}"
                        class="form-control" min="0" required>
                </div>

                <button type="submit" class="btn btn-warning w-100">Save Changes</button>

                <a href="{% url 'games' %}" class="btn btn-secondary w-100 mt-2">Cancel</a>

            </form>
        </div>

    </div>
</div>
{% endblock %}
