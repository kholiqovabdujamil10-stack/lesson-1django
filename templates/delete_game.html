{% extends 'base.html' %}
{% block title %}Delete Game{% endblock %}
{% block content %}

<div class="row justify-content-center mt-5">
    <div class="col-md-6">

        <div class="card shadow p-4 text-center">

            <h2 class="text-danger mb-4">Delete Game</h2>

            <p class="fs-5">Are you sure you want to delete this game?</p>

            <h4>{{ game.home_team.name }} VS {{ game.away_team.name }}</h4>

            <p class="text-muted">{{ game.date|date:"d.m.Y H:i" }}</p>

            <form method="POST">
                {% csrf_token %}

                <button type="submit" class="btn btn-danger w-100">
                    Yes, Delete
                </button>

                <a href="{% url 'games' %}" class="btn btn-secondary w-100 mt-2">
                    Cancel
                </a>

            </form>

        </div>

    </div>
</div>
{% endblock %}
